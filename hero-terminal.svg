<style>
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:15px;white-space:pre}
.p{fill:#8B5CF6} .c{fill:#E6EDF3} .w{fill:#F0F6FC;font-weight:600} .m{fill:#8B949E} .k{fill:#22D3EE} .t{fill:#C9D1D9}
.title{fill:#8B949E;font-size:12px}
.rv{animation-name:reveal;animation-timing-function:steps(var(--n),end);animation-fill-mode:forwards;animation-duration:var(--d)}
@keyframes reveal{from{width:0}to{width:var(--w)}}
.late{opacity:0;animation:fadein .6s ease 10.4s forwards}
@keyframes fadein{to{opacity:1}}
.cur{animation:blink 1.05s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.dot{animation:pulse 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.sweep{animation:sweep 5s linear infinite}
@keyframes sweep{from{transform:translateX(-300px)}to{transform:translateX(830px)}}
@media (prefers-reduced-motion:reduce){.late{animation:none;opacity:1} .rv{animation:none;width:var(--w)} .cur{animation:none} .dot,.sweep{animation:none}}
.rv0{--n:8;--w:76.0px;--d:0.50s;animation-delay:0.6s}
.rv1{--n:56;--w:508.0px;--d:2.52s;animation-delay:1.7s}
.rv2{--n:15;--w:139.0px;--d:0.67s;animation-delay:3.2s}
.rv3{--n:50;--w:454.0px;--d:2.25s;animation-delay:4.3s}
.rv4{--n:48;--w:436.0px;--d:2.16s;animation-delay:5.3s}
.rv5{--n:46;--w:418.0px;--d:2.07s;animation-delay:6.3s}
.rv6{--n:21;--w:193.0px;--d:0.94s;animation-delay:7.8s}
.rv7{--n:54;--w:490.0px;--d:2.43s;animation-delay:9.2s}
</style>
