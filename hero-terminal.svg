<svg xmlns="http://www.w3.org/2000/svg" width="830" height="380" viewBox="0 0 830 380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
