<line class="fl" x1="135" y1="75" x2="151" y2="75"/>
<rect class="b hl" style="animation-delay:1.2s" x="154" y="52" width="110" height="46" rx="8"/><text class="tx" x="209.0" y="79">chunk 500/50</text>
<line class="fl" x1="267" y1="75" x2="283" y2="75"/>
<rect class="b hl" style="animation-delay:2.4s" x="286" y="52" width="110" height="46" rx="8"/><text class="tx" x="341.0" y="79">embed MiniLM</text>
<line class="fl" x1="399" y1="75" x2="415" y2="75"/>
<rect class="b hl" style="animation-delay:3.6s" x="418" y="52" width="110" height="46" rx="8"/><text class="tx" x="473.0" y="79">FAISS index</text>
<line class="fl" x1="531" y1="75" x2="547" y2="75"/>
<rect class="b hl" style="animation-delay:4.8s" x="550" y="52" width="110" height="46" rx="8"/><text class="tx" x="605.0" y="79">top-5 search</text>
