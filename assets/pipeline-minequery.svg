<svg xmlns="http://www.w3.org/2000/svg" width="830" height="150" viewBox="0 0 830 150" role="img" aria-label="MineQuery pipeline: PDF upload, chunking, embeddings, FAISS index, top-5 search, answer with sources." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.b{fill:#161B22;stroke:#30363D} .tx{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;fill:#E6EDF3;text-anchor:middle}
.h{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#9DA7B3} .n{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#8B949E}
.fl{stroke:#22D3EE;stroke-width:2;stroke-dasharray:5 6;animation:fl 1.1s linear infinite;fill:none}
@keyframes fl{to{stroke-dashoffset:-11}}
.hl{animation:hl 7.2s ease-in-out infinite}
@keyframes hl{0%,100%{stroke:#30363D}8%,20%{stroke:#8B5CF6}30%{stroke:#30363D}}
@media (prefers-reduced-motion:reduce){.fl,.hl{animation:none}}
</style><rect width="830" height="150" fill="#0D1117" rx="10"/>
